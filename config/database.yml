# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Production runs against a hosted PostgreSQL database (e.g. Neon), since the
# free hosting target (Render) has no persistent disk. Each logical database
# needs its own separate Postgres database — sharing one physical database
# across all four breaks migration tracking, since Rails records applied
# migrations per database in a schema_migrations table.
production:
  primary:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    adapter: postgresql
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    adapter: postgresql
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
  cable:
    adapter: postgresql
    url: <%= ENV["CABLE_DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
